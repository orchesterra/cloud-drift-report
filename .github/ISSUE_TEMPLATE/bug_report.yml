name: Bug report
description: The tool crashed, or a report is wrong in a way that is not about one resource's match
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste access keys, Terraform state contents, or real account IDs.**
        Replace them with placeholders like `111111111111`.
  - type: input
    id: version
    attributes: { label: Version, description: "Output of `cloud-drift-report --version`" }
    validations: { required: true }
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [terraform, cloudformation, unmanaged, GitHub Action, Claude skill, Cursor rule]
    validations: { required: true }
  - type: textarea
    id: command
    attributes: { label: Command you ran, render: shell }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, and what you expected }
    validations: { required: true }
  - type: textarea
    id: log
    attributes: { label: Error output (redacted), render: text }
