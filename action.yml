name: Cloud Drift Report by OrchesTerra
description: Read-only drift report for Terraform/OpenTofu and CloudFormation, plus AWS resources not in any IaC.
author: OrchesTerra
branding:
  icon: search
  color: purple

inputs:
  mode:
    description: "terraform, cloudformation or unmanaged (AWS resources no state file or stack lists)"
    required: true
  args:
    description: >
      Extra arguments for the mode, for example `--dir ./infra`, `--region us-east-1 --stack api`,
      or `--region us-east-1 --state s3://my-tf-state/prod/`.
    required: false
    default: ""
  fail-on-drift:
    description: "Fail the step when drift (or a resource not in IaC) is found"
    required: false
    default: "true"
  upload-report:
    description: "Upload the HTML, Markdown, JSON and SARIF reports as a workflow artifact"
    required: false
    default: "true"
  report-name:
    description: "Artifact name for the reports"
    required: false
    default: "cloud-drift-report"
  notify:
    description: "Where to send a summary: slack, teams and/or webhook, separated by spaces or commas (default: nowhere)"
    required: false
    default: ""
  notify-on:
    description: "drift (when anything is found; the default), always, or change (new or resolved findings; add --baseline to args)"
    required: false
    default: ""
  slack-webhook-url:
    description: "Slack incoming webhook URL; pass a secret, for example secrets.SLACK_WEBHOOK_URL"
    required: false
    default: ""
  teams-webhook-url:
    description: "Teams Workflows webhook URL (\"When a Teams webhook request is received\"); pass a secret"
    required: false
    default: ""
  webhook-url:
    description: "URL that receives the JSON report as a POST; pass a secret"
    required: false
    default: ""
  webhook-secret:
    description: "Signs webhook bodies with HMAC-SHA256 in the X-Drift-Signature header; pass a secret"
    required: false
    default: ""

outputs:
  findings:
    description: "Number of drifted resources (or resources not in IaC)"
    value: ${{ steps.report.outputs.findings }}
  high:
    description: "Number of high-severity findings"
    value: ${{ steps.report.outputs.high }}
  report-dir:
    description: "Folder with report.html, report.md, report.json and report.sarif"
    value: ${{ steps.report.outputs.dir }}
  sarif-file:
    description: "The SARIF report, for github/codeql-action/upload-sarif (GitHub code scanning)"
    value: ${{ steps.report.outputs.sarif }}

runs:
  using: composite
  steps:
    - name: Install cloud-drift-report
      shell: bash
      # Own virtual environment: newer runner images refuse pip installs into the system Python.
      run: |
        python3 -m venv "$RUNNER_TEMP/cloud-drift-report-venv"
        "$RUNNER_TEMP/cloud-drift-report-venv/bin/pip" install --quiet --disable-pip-version-check "$GITHUB_ACTION_PATH"
        echo "$RUNNER_TEMP/cloud-drift-report-venv/bin" >> "$GITHUB_PATH"

    - name: Run cloud-drift-report
      id: report
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        ARGS: ${{ inputs.args }}
        OUT: ${{ runner.temp }}/cloud-drift-report
        NOTIFY: ${{ inputs.notify }}
        NOTIFY_ON: ${{ inputs.notify-on }}
        IN_SLACK_URL: ${{ inputs.slack-webhook-url }}
        IN_TEAMS_URL: ${{ inputs.teams-webhook-url }}
        IN_WEBHOOK_URL: ${{ inputs.webhook-url }}
        IN_WEBHOOK_SECRET: ${{ inputs.webhook-secret }}
      run: |
        mkdir -p "$OUT"
        # Inputs override same-named environment variables only when set, and never reach the command line.
        for pair in SLACK_WEBHOOK_URL:IN_SLACK_URL TEAMS_WEBHOOK_URL:IN_TEAMS_URL WEBHOOK_URL:IN_WEBHOOK_URL \
                    WEBHOOK_SECRET:IN_WEBHOOK_SECRET; do
          name="${pair#*:}"
          value="${!name}"
          if [ -n "$value" ]; then
            echo "::add-mask::$value"
            export "${pair%%:*}=$value"
          fi
        done
        notify_args=()
        for channel in ${NOTIFY//,/ }; do
          notify_args+=(--notify "$channel")
        done
        if [ -n "$NOTIFY_ON" ]; then
          notify_args+=(--notify-on "$NOTIFY_ON")
        fi
        set +e
        # ARGS is split on spaces on purpose so several flags can be passed in one input.
        # shellcheck disable=SC2086
        cloud-drift-report "$MODE" $ARGS -o "$OUT/report.md" -o "$OUT/report.html" -o "$OUT/report.json" \
          -o "$OUT/report.sarif" "${notify_args[@]}"
        code=$?
        set -e
        if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
          echo "::error::cloud-drift-report failed (exit $code); see the log above."
          exit "$code"
        fi
        python3 - "$OUT/report.json" >> "$GITHUB_OUTPUT" <<'PY'
        import json, sys
        s = json.load(open(sys.argv[1]))["summary"]
        print(f"findings={s['total']}")
        print(f"high={s['high']}")
        PY
        echo "dir=$OUT" >> "$GITHUB_OUTPUT"
        echo "sarif=$OUT/report.sarif" >> "$GITHUB_OUTPUT"
        cat "$OUT/report.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload reports
      if: inputs.upload-report == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.report-name }}
        path: ${{ steps.report.outputs.dir }}

    - name: Fail on drift
      if: inputs.fail-on-drift == 'true' && steps.report.outputs.findings != '0'
      shell: bash
      run: |
        echo "::error::${{ steps.report.outputs.findings }} finding(s); see the job summary or the report artifact."
        exit 2
