[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-drift-report"
version = "0.2.0"
description = "Read-only drift and not-in-IaC report for Terraform/OpenTofu (any cloud) and AWS CloudFormation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["boto3"]
keywords = ["aws", "azure", "gcp", "oci", "terraform", "opentofu", "cloudformation", "drift", "driftctl", "unmanaged", "clickops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://www.orchesterra.in/?utm_source=drift-skill&utm_medium=oss"
Repository = "https://github.com/orchesterra/cloud-drift-report"
Issues = "https://github.com/orchesterra/cloud-drift-report/issues"

[project.scripts]
cloud-drift-report = "drift_report:main"

[project.optional-dependencies]
test = ["pytest"]

# One source file serves the CLI, the Claude skill and the Cursor skill.
[tool.setuptools]
package-dir = { "" = "skills/cloud-drift-report/scripts" }
py-modules = ["drift_report", "aws_inventory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
